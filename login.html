<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="pageTitle">로그인</title>

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header id="siteHeader"></header>

<main>
  <section class="hero-scene" style="--scene-tint:#2e241b;">
    <div class="scene-bg">
      <div class="light-shadow" style="position:absolute; inset:0; opacity:.55;"></div>
      <svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMax slice" aria-hidden="true" style="position:absolute; inset:0; width:100%; height:100%;">
        <defs><radialGradient id="glowLogin" cx="50%" cy="30%" r="55%"><stop offset="0%" stop-color="#F0DFC4" stop-opacity=".4"></stop><stop offset="100%" stop-color="#F0DFC4" stop-opacity="0"></stop></radialGradient></defs>
        <rect x="0" y="0" width="800" height="500" fill="url(#glowLogin)"></rect>
        <circle cx="400" cy="230" r="70" fill="none" stroke="#E8D2A8" stroke-width="3" opacity=".5"></circle>
        <line x1="0" y1="480" x2="800" y2="480" stroke="#E8D2A8" stroke-width="1" opacity=".3"></line>
      </svg>
    </div>
    <div class="scene-overlay"></div>
    <div class="scene-content">
      <div class="wrap">
        <span class="eyebrow">로그인</span>
        <h1 style="font-size:var(--step-4); margin-top:.6rem; max-width:20ch;">간편하게 로그인하세요</h1>
        <p class="lede" style="font-size:var(--step-1); margin-top:1rem; max-width:56ch;" id="heroLede">카카오 또는 네이버 계정으로 로그인하면, 커스터마이징한 옵션을 내 견적함에 저장해 다시 볼 수 있습니다.</p>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap" style="max-width:440px;">
      <p id="loginError" role="alert" style="display:none; font-size:var(--step--1); color:#B3261E; background:color-mix(in srgb, #B3261E 10%, var(--card)); border:1px solid color-mix(in srgb, #B3261E 30%, var(--card-border)); border-radius:var(--radius); padding:.9rem 1.1rem; margin-bottom:1.4rem;">로그인 중 문제가 발생했습니다. 다시 시도해 주세요.</p>

      <label style="display:flex; align-items:flex-start; gap:.6rem; font-size:var(--step--1); color:var(--ink-soft); margin-bottom:1.4rem;">
        <input type="checkbox" id="consentCheck" style="margin-top:.25rem;">
        <span><a href="privacy.html" target="_blank" style="text-decoration:underline;">개인정보 처리방침</a>에 동의합니다. (닉네임, 로그인 제공자, 이메일·프로필 사진(제공 시)을 회원 식별 목적으로 수집합니다)</span>
      </label>

      <div style="display:flex; flex-direction:column; gap:.9rem;">
        <a href="https://api.mutagonglab.com/api/auth/kakao/start" id="kakaoLoginBtn" class="btn btn-kakao" style="justify-content:center; opacity:.5; pointer-events:none;">카카오로 시작하기</a>
        <a href="https://api.mutagonglab.com/api/auth/naver/start" id="naverLoginBtn" class="btn btn-naver" style="justify-content:center; opacity:.5; pointer-events:none;">네이버로 시작하기</a>
      </div>

      <p style="font-size:var(--step--1); color:var(--ink-soft); margin-top:1.6rem;">계정이 없으신가요? 카카오·네이버 로그인 시 자동으로 회원가입됩니다.</p>
    </div>
  </section>
</main>

<footer id="siteFooter"></footer>

</html>
