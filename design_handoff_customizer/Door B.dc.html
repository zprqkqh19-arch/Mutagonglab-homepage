<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  html,body{margin:0;padding:0;background:#f5f4f2;}
  a{color:#2a2a2c;} a:hover{color:#000;}
</style>
</helmet>
<div style="display:flex; flex-direction:column; align-items:center; gap:16px; padding:32px; font-family:Helvetica, Arial, sans-serif;">
  <div style="display:flex; gap:24px; align-items:baseline; color:#555; font-size:13px;">
    <span style="font-weight:700; color:#222; font-size:15px;">B — 3연동 중문 (A 내경 설치)</span>
    <span>{{ sizeLabel }}</span>
    <span>내경 {{ innerW }} × {{ innerH }}</span>
    <span>패널 3짝 · 깊이 100</span>
  </div>
  <svg width="{{ svgW }}" height="760" viewBox="{{ viewBox }}" style="display:block; background:#ffffff; border:1px solid #e3e1dd;">
    <defs>
      <linearGradient id="vpost" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="{{ cDark }}"></stop>
        <stop offset="0.18" stop-color="{{ cLight }}"></stop>
        <stop offset="0.55" stop-color="{{ cMain }}"></stop>
        <stop offset="0.9" stop-color="{{ cDark }}"></stop>
      </linearGradient>
      <linearGradient id="hrail" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="{{ cLight }}"></stop>
        <stop offset="0.35" stop-color="{{ cMain }}"></stop>
        <stop offset="0.85" stop-color="{{ cDark }}"></stop>
      </linearGradient>
      <linearGradient id="dstile" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="{{ dDark }}"></stop>
        <stop offset="0.2" stop-color="{{ dLight }}"></stop>
        <stop offset="0.6" stop-color="{{ dMain }}"></stop>
        <stop offset="0.92" stop-color="{{ dDark }}"></stop>
      </linearGradient>
      <linearGradient id="drail" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="{{ dLight }}"></stop>
        <stop offset="0.4" stop-color="{{ dMain }}"></stop>
        <stop offset="0.88" stop-color="{{ dDark }}"></stop>
      </linearGradient>
      <pattern id="thread" width="10" height="7" patternUnits="userSpaceOnUse">
        <line x1="0" y1="6" x2="10" y2="1" stroke="{{ cLight }}" stroke-width="1.8"></line>
      </pattern>
      <pattern id="gMoru" width="22" height="22" patternUnits="userSpaceOnUse">
        <circle cx="6" cy="6" r="4" fill="rgba(255,255,255,0.35)"></circle>
        <circle cx="17" cy="17" r="4" fill="rgba(255,255,255,0.25)"></circle>
      </pattern>
      <pattern id="gFabric" width="16" height="16" patternUnits="userSpaceOnUse">
        <line x1="0" y1="4" x2="16" y2="4" stroke="rgba(255,255,255,0.28)" stroke-width="2"></line>
        <line x1="4" y1="0" x2="4" y2="16" stroke="rgba(255,255,255,0.22)" stroke-width="2"></line>
      </pattern>
      <linearGradient id="gSatin" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="rgba(255,255,255,0.45)"></stop>
        <stop offset="0.5" stop-color="rgba(255,255,255,0.08)"></stop>
        <stop offset="1" stop-color="rgba(255,255,255,0.4)"></stop>
      </linearGradient>
    </defs>
    <sc-if value="{{ showA }}" hint-placeholder-val="{{ true }}">{{ frameALayer }}</sc-if>
    {{ doorLayer }}
  </svg>
  <div style="color:#8a877f; font-size:12px;">순차 개폐: Tweaks의 '개폐율' 슬라이더로 확인 · 단위 mm</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:900},&quot;sizeCode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;12-22&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;11-20&quot;,&quot;11-21&quot;,&quot;11-22&quot;,&quot;11-23&quot;,&quot;12-20&quot;,&quot;12-21&quot;,&quot;12-22&quot;,&quot;12-23&quot;,&quot;13-22&quot;,&quot;13-23&quot;],&quot;section&quot;:&quot;사이즈&quot;},&quot;doorColor&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;화이트&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;화이트&quot;,&quot;그레이&quot;,&quot;블랙&quot;],&quot;section&quot;:&quot;B 중문&quot;},&quot;glass&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;투명&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;투명&quot;,&quot;브론즈&quot;,&quot;미스트&quot;,&quot;모루&quot;,&quot;샤틴&quot;,&quot;패브릭&quot;],&quot;section&quot;:&quot;B 중문&quot;},&quot;gansal&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;없음&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;없음&quot;,&quot;가로&quot;,&quot;세로&quot;],&quot;section&quot;:&quot;B 중문&quot;},&quot;handle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;기본&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;기본&quot;,&quot;원형&quot;,&quot;일자형&quot;],&quot;section&quot;:&quot;B 중문&quot;},&quot;openPct&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:100,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;구동&quot;},&quot;frameColorA&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;실버&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;실버&quot;,&quot;블랙&quot;,&quot;화이트&quot;,&quot;그레이&quot;],&quot;section&quot;:&quot;A 프레임&quot;},&quot;showA&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;A 프레임&quot;},&quot;boltGap&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:30,&quot;min&quot;:30,&quot;max&quot;:60,&quot;unit&quot;:&quot;mm&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;A 프레임&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const el = React.createElement;
    const sizes = {'11-20':[1100,2000],'11-21':[1100,2100],'11-22':[1100,2200],'11-23':[1100,2300],'12-20':[1200,2000],'12-21':[1200,2100],'12-22':[1200,2200],'12-23':[1200,2300],'13-22':[1300,2200],'13-23':[1300,2300]};
    const code = this.props.sizeCode ?? '12-22';
    const [W, H] = sizes[code] || sizes['12-22'];
    const p = 30, subH = 70, boltGap = this.props.boltGap ?? 30;
    const mainTop = subH + boltGap;
    const mainH = H - mainTop;
    const innerW = W - p * 2, innerH = H - mainTop - p;
    const iX = p, iY = mainTop + p;
    const pal = {
      '실버':   { main:'#c9c9cc', light:'#ececed', dark:'#96969a', slot:'#7e7e83' },
      '블랙':   { main:'#2b2b2e', light:'#4a4a4e', dark:'#151517', slot:'#0a0a0b' },
      '화이트': { main:'#eeece7', light:'#fbfaf7', dark:'#c9c6bf', slot:'#b5b2aa' },
      '그레이': { main:'#8e8e91', light:'#b4b4b7', dark:'#5f5f63', slot:'#4c4c50' },
    };
    const c = pal[this.props.frameColorA ?? '실버'] || pal['실버'];
    const d = pal[this.props.doorColor ?? '화이트'] || pal['화이트'];
    const glassDefs = {
      '투명':   { fill:'rgba(190,205,212,0.30)', overlay:null },
      '브론즈': { fill:'rgba(122,84,52,0.45)',  overlay:null },
      '모루':   { fill:'rgba(205,212,215,0.55)', overlay:'url(#gMoru)' },
      '미스트': { fill:'rgba(232,234,235,0.75)', overlay:null },
      '샤틴':   { fill:'rgba(222,226,228,0.6)',  overlay:'url(#gSatin)' },
      '패브릭': { fill:'rgba(210,206,198,0.65)', overlay:'url(#gFabric)' },
    };
    const g = glassDefs[this.props.glass ?? '투명'] || glassDefs['투명'];
    const gansal = this.props.gansal ?? '없음';
    const handle = this.props.handle ?? '기본';
    const openPct = (this.props.openPct ?? 0) / 100;
    const rect = (k,x,y,w,h,fill,extra) => el('rect', Object.assign({key:k,x,y,width:w,height:h,fill}, extra||{}));
    const line = (k,x1,y1,x2,y2,stroke,sw) => el('line',{key:k,x1,y1,x2,y2,stroke,'strokeWidth':sw});
    // ---- A 프레임 (참고 표시) ----
    const boltXs = [5, p-15, W-p+5, W-15];
    const aShapes = [
      rect('sl',0,0,p,subH,'url(#vpost)'), rect('sr',W-p,0,p,subH,'url(#vpost)'), rect('sb',0,0,W,p,'url(#hrail)'),
      rect('ml',0,mainTop,p,mainH,'url(#vpost)'), rect('mr',W-p,mainTop,p,mainH,'url(#vpost)'), rect('mb',0,mainTop,W,p,'url(#hrail)'),
      line('t1',0,p/2,W,p/2,c.slot,6), line('t2',p/2,p,p/2,subH,c.slot,6), line('t3',W-p/2,p,W-p/2,subH,c.slot,6),
      line('t4',p/2,mainTop,p/2,H,c.slot,6), line('t5',W-p/2,mainTop,W-p/2,H,c.slot,6), line('t6',0,mainTop+p/2,W,mainTop+p/2,c.slot,6),
    ];
    boltXs.forEach((x,i)=>{ aShapes.push(rect('b'+i,x,subH,10,boltGap,c.dark)); aShapes.push(rect('bt'+i,x,subH,10,boltGap,'url(#thread)')); });
    const frameALayer = el('g',{key:'A'}, aShapes);
    // ---- B 패널 (3연동, 순차/연동 개폐: p1 속도 2배, p3 고정측) ----
    const ov = 40;
    const panelW = (innerW + 2*ov) / 3;
    const closedX = [0, panelW-ov, 2*(panelW-ov)];
    const R = innerW - panelW;
    const px = [ closedX[0] + openPct*(R-closedX[0]), closedX[1] + openPct*(R-closedX[1]), closedX[2] ];
    const stile = 30, topRail = 30, botRail = 60;
    const makePanel = (k, x, front, withHandle) => {
      const gx = x+stile, gy = topRail, gw = panelW-stile*2, gh = innerH-topRail-botRail;
      const s = [
        rect(k+'gl',gx,gy,gw,gh,g.fill),
      ];
      if (g.overlay) s.push(rect(k+'go',gx,gy,gw,gh,g.overlay));
      // 간살
      if (gansal === '가로') {
        s.push(rect(k+'h1',gx,gy+gh*0.30,gw,20,'url(#drail)'));
        s.push(rect(k+'h2',gx,gy+gh*0.72,gw,20,'url(#drail)'));
      } else if (gansal === '세로') {
        s.push(rect(k+'v1',gx+gw/2-10,gy,20,gh,'url(#dstile)'));
      } else if (gansal === '아치') {
        s.push(el('path',{key:k+'arc', d:`M ${gx} ${gy+gh*0.22} Q ${gx+gw/2} ${gy+gh*0.02} ${gx+gw} ${gy+gh*0.22}`, fill:'none', stroke:d.main, strokeWidth:20}));
      }
      // 패널 프레임
      s.push(rect(k+'stL',x,0,stile,innerH,'url(#dstile)'));
      s.push(rect(k+'stR',x+panelW-stile,0,stile,innerH,'url(#dstile)'));
      s.push(rect(k+'rT',x,0,panelW,topRail,'url(#drail)'));
      s.push(rect(k+'rB',x,innerH-botRail,panelW,botRail,'url(#drail)'));
      s.push(el('rect',{key:k+'ol',x,y:0,width:panelW,height:innerH,fill:'none',stroke:d.dark,strokeWidth:2}));
      if (!front) s.push(rect(k+'sh',x,0,panelW,innerH,'rgba(0,0,0,0.10)'));
      // 손잡이
      if (withHandle) {
        const hx = x + stile/2, hy = innerH*0.5;
        if (handle === '원형') s.push(el('circle',{key:k+'hd',cx:hx,cy:hy,r:28,fill:'none',stroke:d.light,strokeWidth:10}));
        else if (handle === '일자형') s.push(rect(k+'hd',hx-6,hy-150,12,300,d.light,{rx:6}));
        else s.push(rect(k+'hd',hx-8,hy-60,16,120,d.light,{rx:8}));
      }
      return el('g',{key:k}, s);
    };
    const doorLayer = el('g',{key:'B', transform:`translate(${iX},${iY})`}, [
      makePanel('p3', px[2], false, false),
      makePanel('p2', px[1], false, false),
      makePanel('p1', px[0], true, true),
    ]);
    const pad = 60;
    return {
      innerW, innerH, showA: this.props.showA ?? true,
      sizeLabel: `W${W} × H${H} (${code})`,
      cMain:c.main, cLight:c.light, cDark:c.dark,
      dMain:d.main, dLight:d.light, dDark:d.dark,
      frameALayer, doorLayer,
      viewBox: `${-pad} ${-pad} ${W+pad*2} ${H+pad*2}`,
      svgW: Math.round(760*(W+pad*2)/(H+pad*2)),
    };
  }
}
</script>
</body>
</html>
