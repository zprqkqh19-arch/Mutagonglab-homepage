<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>페이지를 찾을 수 없습니다 | 혜다움</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="/Mutagonglab-homepage/styles.css">
<style>
  .nf-wrap{ min-height:70vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:80px 24px; }
  .nf-inner{ max-width:520px; }
  .nf-code{ font-size:13px; letter-spacing:.18em; color:var(--ink-soft); margin:0 0 18px; }
  .nf-title{ font-size:28px; line-height:1.4; margin:0 0 14px; }
  .nf-desc{ color:var(--ink-soft); line-height:1.8; margin:0 0 32px; }
  .nf-links{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .nf-links a{
    display:inline-block; padding:12px 22px; border:1px solid var(--paper-line);
    border-radius:999px; text-decoration:none; color:var(--ink); font-size:14px;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .nf-links a:hover{ background:var(--accent); border-color:var(--accent); color:#fff; }
  @media (max-width:600px){ .nf-title{ font-size:22px; } }
</style>
</head>
<body>

<header id="siteHeader">
  <div class="wrap nav">
    <a href="/Mutagonglab-homepage/index.html" class="logo">
      <span class="logo-text"><span class="logo-kr">혜다움</span><span class="logo-en">HEDAUM</span></span>
    </a>
    <nav class="nav-links" aria-label="주요 메뉴">
      <a href="/Mutagonglab-homepage/products.html">제품</a>
      <a href="/Mutagonglab-homepage/service.html">서비스</a>
      <a href="/Mutagonglab-homepage/contact.html">상담 문의</a>
    </nav>
  </div>
</header>

<main class="nf-wrap">
  <div class="nf-inner">
    <p class="nf-code">404</p>
    <h1 class="nf-title">찾으시는 페이지가 없습니다</h1>
    <p class="nf-desc">
      주소가 바뀌었거나 삭제된 페이지일 수 있습니다.<br />
      아래에서 다시 찾아보세요.
    </p>
    <div class="nf-links">
      <a href="/Mutagonglab-homepage/index.html">홈으로</a>
      <a href="/Mutagonglab-homepage/products.html">제품 보기</a>

    </div>
  </div>

</body>
</html>
