<script src="auth.js"></script>
<script>
(function () {
  "use strict";

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  window.MUTAGONG_AUTH.getMe().then(function (me) {
    if (!me || !me.loggedIn) {
      window.location.href = "login.html";
      return;
    }
    document.getElementById("greeting").textContent = me.nickname + "님, 안녕하세요";

    fetch(window.MUTAGONG_AUTH.API_BASE + "/api/saved-configs", { credentials: "include" })
      .then(function (res) { return res.ok ? res.json() : { configs: [] }; })
      .catch(function () { return { configs: [] }; })
      .then(function (data) {
        var list = document.getElementById("savedConfigsList");
        var empty = document.getElementById("savedConfigsEmpty");
        var configs = data.configs || [];
        if (!configs.length) {
          empty.style.display = "block";
          return;
        }
        list.innerHTML = configs.map(function (c) {
          var date = new Date(c.created_at).toLocaleDateString("ko-KR");
          return (
            '<div class="contact-card" style="padding:1.1rem 1.3rem;">' +
              '<p style="font-weight:700; margin-bottom:.3rem;">' + escapeHtml(c.label) + '</p>' +
              '<p style="font-family:monospace; font-size:var(--step--1); color:var(--ink-soft); margin-bottom:.4rem;">' + escapeHtml(c.summary_text) + '</p>' +
              '<p style="font-size:.74rem; color:var(--ink-soft); margin-bottom:0;">' + date + '</p>' +
            '</div>'
          );
        }).join("");
      });
  });

  document.getElementById("logoutBtn").addEventListener("click", function () {
    window.MUTAGONG_AUTH.logout();
  });
})();
</script>
